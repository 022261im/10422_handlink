<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANDLINK</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark">H</div><div><h1>HANDLINK</h1><p>GESTURE · ACCESS</p></div></div><span id="topStatus">카메라 연결 전</span></header><section class="intro"><div class="intro-main"><h2>손동작 하나로,<br>일상과 연결되다.</h2><p>손동작 기반 의사소통과 키오스크 접근성</p></div></section><nav class="modes"><button class="mode-tab active" data-mode="communication">의사소통</button><button class="mode-tab" data-mode="kiosk">키오스크</button><button class="mode-tab" data-mode="research">성능 분석</button></nav><div class="workspace"><section class="panel"><h3>실시간 인식</h3><video id="inputVideo" playsinline muted></video><canvas id="outputCanvas"></canvas><div class="camera-placeholder" id="cameraPlaceholder"><button id="startCamera">카메라 시작</button></div><button id="stopCamera" disabled>종료</button><button id="speakOutput">읽어주기</button><div id="modelTag">MODEL OFF</div><div id="recognitionState">대기 중</div><div id="recognitionOutput">손동작을 기다리는 중</div><div id="recognitionHelp"></div><div id="confidenceBar"></div><div id="confidenceText">—</div><div id="cameraHelp"></div></section><div class="right-stack"><section class="panel mode-content active" id="communicationPanel"><h3>표현 보드</h3><div class="phrase" data-phrase="도와주세요">✌️ 도와주세요</div><div class="phrase" data-phrase="네, 알겠습니다">👍 네</div><div class="phrase" data-phrase="잠시만 기다려 주세요">✋ 기다려 주세요</div><div class="phrase" data-phrase="아니요 / 취소할게요">✊ 취소</div><div class="phrase" data-phrase="이것을 원해요">☝️ 이것을 원해요</div></section><section class="panel mode-content" id="kioskPanel"><h3>키오스크</h3><button class="menu-item selected" data-item="음료" data-price="2500">음료</button><button class="menu-item" data-item="샌드위치" data-price="4500">샌드위치</button><button class="menu-item" data-item="샐러드" data-price="5000">샐러드</button><button class="menu-item" data-item="도움 요청" data-price="0">도움 요청</button><div id="kioskStatus">음료 선택</div><button id="kioskConfirm">확인</button><button id="kioskCancel">취소</button><button id="kioskHelp">도움</button></section><section class="panel mode-content" id="researchPanel"><h3>성능 기록</h3><div id="metricRecognized">0</div><div id="metricLatency">—</div><div id="metricPending">0</div><button id="exportLog">CSV 내보내기</button><div id="eventLog"></div></section><section class="panel"><h3>설정</h3><button class="switch" id="autoSpeak">자동 음성</button><button class="switch on" id="showPreview">미리보기</button></section></div></div></div><div id="toast" hidden></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script><script src="app.js"></script></body></html>
